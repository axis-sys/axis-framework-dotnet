name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AXIS_NUGET_USER: ${{ github.actor }}
      # The Axis packages were first published from another repository, so this repository's GITHUB_TOKEN
      # cannot read them: the organization secret AXIS_PACKAGES_TOKEN (read:packages) can. Without it, the
      # GITHUB_TOKEN is used.
      AXIS_NUGET_TOKEN: ${{ secrets.AXIS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - id: version
        run: echo "value=$(dotnet msbuild src/Axis.Conventions.Analyzers/Axis.Conventions.Analyzers.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"
      # The integration and E2E tests of the reference application start Postgres and MySQL with Testcontainers;
      # ubuntu-latest runs Docker. The package packs from its own project: packing the solution would warn on the
      # web host, which is not packable.
      - name: Build, test and pack
        if: ${{ !contains(steps.version.outputs.value, '-') }}
        run: |
          dotnet build AxisFramework.slnx -c Release -warnaserror
          dotnet test --solution AxisFramework.slnx -c Release --no-build
          dotnet pack src/Axis.Conventions.Analyzers/Axis.Conventions.Analyzers.csproj -c Release --no-build -o artifacts
      - name: Publish to nuget.org
        if: ${{ !contains(steps.version.outputs.value, '-') }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
      - name: Tag and GitHub release
        if: ${{ !contains(steps.version.outputs.value, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target main --title "$tag" --notes-file CHANGELOG.md
